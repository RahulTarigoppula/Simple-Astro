# Deploy the Vite app (repo root) to GitHub Pages.
# Prereq: repo Settings -> Pages -> Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Engine maths gate the deploy; UI tests live in ci.yml so a slow runner never blocks it.
      - run: npx vitest run --project engine
      - name: Build (served from /<repo>/)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Anonymous counts: set a repository variable VITE_GOATCOUNTER to your GoatCounter code. Empty = off.
          VITE_GOATCOUNTER: ${{ vars.VITE_GOATCOUNTER }}
      - name: Bundle budget and forbidden modules
        run: node scripts/check-bundle.mjs
      - name: SPA fallback for deep links (harmless with hash routing)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
