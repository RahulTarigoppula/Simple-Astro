# Build a SIGNED Capacitor APK in the cloud and attach it to a GitHub Release.
# Needs the four ANDROID_* secrets (docs/DEPLOYMENT.md §keystore) and the signing block in android/app/build.gradle.
# Release:  git tag v1.0.0 && git push origin v1.0.0
name: android-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app (base "/" because Capacitor serves from https://localhost/)
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PLATFORM: android

      - name: No service worker and nothing forbidden in the Android bundle
        run: node scripts/check-bundle.mjs
        env:
          VITE_PLATFORM: android

      - name: Sync web assets and plugins into android/
        run: npx cap sync android

      - name: Decode keystore
        if: env.HAS_KS == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK (signed when the secrets exist)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.HAS_KS == 'true' && format('{0}/release.p12', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="${VERSION_NAME#v}"

      - name: Collect output (a tag must produce a signed APK)
        run: |
          mkdir -p out
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then echo "::error::unsigned build on a tag — set the ANDROID_* secrets"; exit 1; fi
            APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          cp "$APK" "out/${{ github.event.repository.name }}-${VERSION_NAME#v}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - name: APK size budget (40 MB)
        run: |
          size=$(stat -c %s out/*.apk); echo "APK bytes: $size"
          test "$size" -le 41943040

      - name: The APK must contain the hand model and must NOT contain a service worker
        run: |
          unzip -l out/*.apk > /tmp/apk.txt
          grep -q "assets/public/models/hand_landmarker.task" /tmp/apk.txt
          ! grep -q "assets/public/sw.js" /tmp/apk.txt

      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ env.VERSION_NAME }}
          path: out/
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt
