# Checks kept separate from Pages so a flaky gesture never blocks a deploy.
name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - run: node scripts/check-no-biometrics.mjs
      - run: node scripts/check-licences.mjs
      - run: npx tsc -b
      - run: npx vitest run --project engine --project dom
      - name: Engine determinism across hostile zones
        run: |
          TZ=Asia/Kolkata npx vitest run --project engine
          TZ=UTC          npx vitest run --project engine
      - run: npx vitest run --project oracle
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_BASE_PATH: /jyoti/
      - run: node scripts/check-bundle.mjs
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7
